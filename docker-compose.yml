# Три отдельных сервиса: backend -> frontend -> nginx.
services:
  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-autochoice-backend:local}
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - autochoice-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 15s

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-autochoice-frontend:local}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Сам Node-сервер отдаёт статический index.html на порту 3000.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => {if(!r.ok)process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  nginx:
    build: ./nginx
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    image: ${NGINX_IMAGE:-autochoice-nginx:local}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  autochoice-db:

