<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#f7f9fc"/>
<meta name="description" content="AutoChoice — игровой подбор автомобиля по потребностям и предпочтениям."/>
<link rel="icon" href="/static/images/mark.svg" type="image/svg+xml"/>
<title>AutoChoice — найди свой автомобиль</title><script>
(function () {
  var mode = null;
  try { mode = localStorage.getItem('autochoice-theme-v1'); } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = mode;
  document.documentElement.style.colorScheme = mode;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', mode === 'dark' ? '#0b1222' : '#f7f9fc');
})();
</script></head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
