# Nginx — единственный контейнер, доступный извне на порту 80.
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hack-ovb-08-vm1-86a371.vm.prodcontest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hack-ovb-08-vm1-86a371.vm.prodcontest.com/privkey.pem;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    client_max_body_size 2m;

    # Swagger и все JSON-запросы идут прямо в Python backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://backend:8000/health; }
    # Фото автомобилей загружаются из backend, а не из React-контейнера.
    location /cars/ { proxy_pass http://backend:8000; }
    # Главная и сборка React — из контейнера frontend:3000.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }
}
